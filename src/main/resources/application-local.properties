spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/opensec}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
jwt.secret=${JWT_SECRET:CmdBDJh6KiHb1N7WUJq8bC2MDUwOT3C6}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600000}
opensec.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:admin}
